<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Global Trade Finder</title>
<meta name="description" content="Global Trade Finder: encuentre compradores y proveedores internacionales por país, sector, producto y código HS. Una aplicación de SkyNet Genesis.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 200 200%22%3E%3Crect x=%224%22 y=%224%22 width=%22192%22 height=%22192%22 rx=%2246%22 fill=%22%231E3A4C%22/%3E%3Cg stroke=%22%23fff%22 stroke-width=%226%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M100 100L100 42M100 100L150 71M100 100L150 129M100 100L100 158M100 100L50 129M100 100L50 71%22/%3E%3C/g%3E%3Ccircle cx=%22100%22 cy=%2242%22 r=%2213%22 fill=%22%23E0A21A%22/%3E%3Ccircle cx=%22100%22 cy=%22100%22 r=%2220%22 fill=%22%23E0A21A%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: barra superior azul petróleo; buscador central con pestañas; vistas por ancla (#pais-CO, #hs-0901…) con migas de pan que siguen la ruta Continente → País → Sector → Producto → HS → Empresas */
:root{
  /* Paleta FamilIA Salud (solo modo claro) */
  --petroleo:#0B4F8A; --petroleo-2:#1867B0; --ambar:#14A38B; --ambar-2:#0E8571; --verde:#1F8A4C;
  --bg:#F4F8FB; --surface:#FFFFFF; --text:#1C2B39; --muted:#5D6B78; --line:#DCE5EE;
  --chip:#E8F1FA; --bar:#FFFFFF; --soft-ambar:#E3F6F2; --soft-pet:#E8F1FA; --soft-verde:#E3F6F2;
  --danger:#C0392B; --on-dark:#FFFFFF; --link:#0B4F8A;
  --f-title:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-text:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-padding-top:80px}
body{background:var(--bg);color:var(--text);font-family:var(--f-text);font-size:15.5px;line-height:1.55;margin:0}
a{color:var(--link)}
h1,h2,h3,h4{font-family:var(--f-title);font-weight:700;line-height:1.05;text-wrap:balance;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ambar);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* Barra superior */
.top{background:var(--bar);color:var(--text);box-shadow:0 2px 12px rgba(11,79,138,.10);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.top .wrap{display:flex;align-items:center;gap:14px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--petroleo);margin-right:auto}
.brand svg{width:40px;height:40px;flex:none}
.brand .wm{display:flex;flex-direction:column;line-height:.95}
.brand .wm b{font-family:var(--f-title);font-size:1.45rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700}
.brand .wm b span{color:var(--ambar-2)}
.brand .wm small{font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.nav{display:flex;gap:2px;flex-wrap:wrap;align-items:center}
.nav a{color:var(--text);text-decoration:none;padding:8px 11px;border-radius:6px;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent}
.nav a:hover{background:var(--soft-pet)}
.nav a.on{border-bottom-color:var(--ambar)}
.nav a.cta{background:var(--ambar-2);color:#fff}
.lang{display:flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{background:transparent;border:0;color:var(--muted);padding:5px 9px;font-weight:700;font-size:.8rem;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--petroleo);color:#fff}
.menu-btn{display:none;background:transparent;border:1.5px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer}

.demo-strip{background:var(--soft-ambar);border-bottom:1px solid var(--ambar);font-size:.85rem}
.demo-strip .wrap{padding-block:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-strip b{font-weight:700}
.demo-strip .wrap{justify-content:space-between}
.demo-try{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.demo-try .chip{background:var(--surface);border-color:var(--ambar)}
.demo-lvl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;width:100%}
.demo-try .chip[aria-pressed="true"]{background:var(--ambar-2);border-color:var(--ambar-2);color:#fff}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:8px;border:0;cursor:pointer;font-weight:700;text-decoration:none;font-size:.94rem;line-height:1.2}
.btn-main{background:linear-gradient(135deg,var(--petroleo),var(--petroleo-2));color:#fff}
.btn-main:hover{filter:brightness(1.08)}
.btn-amb{background:var(--ambar-2);color:#fff}
.btn-amb:hover{filter:brightness(1.06)}
.btn-wa{background:var(--verde);color:#fff}
.btn-wa:hover{filter:brightness(1.08)}
.btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--petroleo)}
.btn-sm{padding:7px 11px;font-size:.86rem}
.btn svg{width:17px;height:17px;flex:none}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--link);font-weight:600;cursor:pointer;text-decoration:underline}

/* Portada */
.hero{padding-block:44px 28px}
.eyebrow{font-family:var(--f-title);text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--petroleo);font-size:.98rem;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:"";width:26px;height:4px;border-radius:2px;background:var(--ambar);flex:none}
.hero h1{font-size:clamp(2.3rem,5vw,3.9rem);text-transform:uppercase;margin-top:10px;letter-spacing:.005em;max-width:22ch}
.hero h1 span{color:var(--ambar-2)}
.hero p.lead{max-width:62ch;color:var(--muted);font-size:1.06rem;margin:14px 0 22px}

.searchbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 8px 28px rgba(21,35,43,.08)}
.stabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.stabs button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font-weight:700;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;font-size:.93rem}
.stabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--ambar);background:var(--soft-ambar)}
.srow{display:flex;gap:8px;position:relative}
.srow input{flex:1;min-width:0;padding:13px 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--bg);font-size:1.02rem}
.srow input:focus{border-color:var(--petroleo);outline:none}
.suggest{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px rgba(0,0,0,.15);z-index:20;max-height:340px;overflow:auto}
.suggest button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--line)}
.suggest button:hover,.suggest button.act{background:var(--soft-pet)}
.suggest .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;min-width:62px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center;font-size:.86rem}
.quick .lbl{color:var(--muted);margin-right:4px}

.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--chip);color:var(--text);padding:3px 9px;border-radius:99px;font-size:.82rem;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
button.chip:hover,a.chip:hover{border-color:var(--petroleo)}
.chip .mono{font-size:.78rem}
.cc{display:inline-grid;place-items:center;min-width:28px;height:20px;padding:0 5px;border-radius:4px;background:var(--petroleo);color:#fff;font-family:var(--f-mono);font-size:.72rem;font-weight:700;letter-spacing:.04em}

.path{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:26px}
.path div{border-top:4px solid var(--line);padding-top:8px;font-size:.84rem}
.path div b{display:block;font-family:var(--f-title);font-size:1.12rem;text-transform:uppercase;letter-spacing:.04em}
.path div span{color:var(--muted)}
.path div:nth-child(-n+3){border-top-color:var(--petroleo)}
.path div:nth-child(n+4):nth-child(-n+6){border-top-color:var(--ambar)}
.path div:last-child{border-top-color:var(--verde)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-family:var(--f-title);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:.86rem}

/* Secciones */
section{padding-block:26px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.sec-head h2{font-size:clamp(1.7rem,3.4vw,2.3rem);text-transform:uppercase}
.page{padding-block:24px 30px}
.page h1{font-size:clamp(2rem,4.6vw,3.1rem);text-transform:uppercase}
.page .lead{color:var(--muted);max-width:70ch;margin:6px 0 0}

.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:.86rem;margin-bottom:14px;color:var(--muted)}
.crumbs a{color:var(--link);text-decoration:none;font-weight:600}
.crumbs a:hover{text-decoration:underline}
.crumbs .sep{opacity:.6}
.crumbs .lv{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;background:var(--chip);border-radius:4px;padding:1px 5px;margin-right:3px;color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;gap:6px;min-width:0;cursor:pointer;text-align:left}
.tile:hover{border-color:var(--petroleo)}
.tile h3{font-size:1.35rem}
.tile .meta{display:flex;gap:10px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.tile .meta b{color:var(--text);font-variant-numeric:tabular-nums}

/* Resultados */
.layout{display:grid;grid-template-columns:260px 1fr;gap:20px;align-items:start}
.layout>*{min-width:0}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:80px}
.filters h3{font-size:1.2rem;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-weight:700;font-size:.86rem}
.field input,.field select,.field textarea{padding:9px 11px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);width:100%}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--petroleo);outline:none}
.field .hint{font-size:.8rem;color:var(--muted)}
.field .err{color:var(--danger);font-size:.82rem;min-height:1em}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.check input{width:18px;height:18px;margin-top:2px;flex:none}

.resbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.resbar h2{font-size:1.6rem;text-transform:uppercase}
.resbar .acts{display:flex;gap:6px;flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.co{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.co:hover{border-color:var(--petroleo)}
.co h3{font-size:1.32rem}
.co h3 a{color:var(--text);text-decoration:none}
.co h3 a:hover{text-decoration:underline}
.co .line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.86rem;color:var(--muted)}
.co .codes{display:flex;gap:5px;flex-wrap:wrap;grid-column:1/-1}
.co .side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.role{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:5px;white-space:nowrap}
.role.buyer{background:var(--soft-ambar);color:var(--text);border:1px solid var(--ambar)}
.role.supplier{background:var(--soft-pet);color:var(--text);border:1px solid var(--petroleo)}
.role.both{background:var(--soft-verde);color:var(--text);border:1px solid var(--verde)}
.ver{color:var(--verde);font-weight:700;font-size:.8rem;display:inline-flex;gap:4px;align-items:center}
.demo{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border:1px dashed var(--muted);border-radius:4px;padding:1px 5px}
.mine{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--ambar-2);color:#fff;border-radius:4px;padding:2px 6px}

table.t{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:2px solid var(--line);padding:8px 10px}
table.t td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
table.t tr:hover td{background:var(--soft-pet)}
table.t td.r,table.t th.r{text-align:right}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.codecell{font-family:var(--f-mono);font-weight:700;white-space:nowrap}
.codecell a{color:var(--link);text-decoration:none}

.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(0,1.4fr) 2fr 42px;gap:10px;align-items:center;font-size:.86rem}
.bar .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .trk{background:var(--chip);border-radius:4px;height:12px;overflow:hidden;display:flex}
.bar .s{background:var(--petroleo);height:100%}
.bar .b{background:var(--ambar);height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.panel h2{font-size:1.45rem;text-transform:uppercase;margin-bottom:10px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start}
.two>*{min-width:0}
.stack{display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.lock{border:1.5px dashed var(--ambar);background:var(--soft-ambar);border-radius:10px;padding:14px;font-size:.92rem}
.lock b{display:block;margin-bottom:4px}
.blur{filter:blur(4px);user-select:none}

.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:7px 12px;font-weight:700;cursor:pointer;font-size:.88rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--petroleo);color:#fff}

.plans{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.rec{border:2px solid var(--ambar)}
.plan h3{font-size:1.6rem;text-transform:uppercase}
.plan .who{font-size:.86rem;color:var(--muted)}
.plan .price{font-family:var(--f-title);font-size:1.5rem;font-weight:700}
.plan ul{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.plan .acts{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.badge-cur{align-self:flex-start;background:var(--verde);color:#fff;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;flex-direction:column;gap:3px;border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--bg);text-align:left;width:100%}
.opt:hover{border-color:var(--petroleo)}
.opt[aria-pressed="true"]{border-color:var(--ambar);background:var(--soft-ambar)}
.opt b{font-size:1rem}
.opt span{font-size:.84rem;color:var(--muted);line-height:1.35}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields .full{grid-column:1/-1}
.chips-in{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chips-in .chip button{background:none;border:0;cursor:pointer;padding:0 0 0 2px;font-weight:700;color:var(--muted)}

.empty{text-align:center;padding:30px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--text);font-size:1.05rem;margin-bottom:4px}

.modal-bg{position:fixed;inset:0;background:rgba(10,20,26,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--text);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:20px;border:1px solid var(--line)}
.modal h2{font-size:1.6rem;text-transform:uppercase;margin-bottom:8px}
.modal .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:14px}
.report-foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:.82rem;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.report-foot svg{width:22px;height:22px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:9px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}

.wa-float{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--verde);color:#fff;border-radius:99px;display:flex;align-items:center;gap:8px;padding:12px 16px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:25;text-decoration:none;font-weight:700;font-size:.9rem}
.wa-float svg{width:22px;height:22px}

footer{border-top:1px solid var(--line);margin-top:30px;padding-block:24px 80px;color:var(--muted);font-size:.86rem}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer .sg{display:flex;align-items:center;gap:10px}
footer .sg svg{width:30px;height:30px;flex:none}
footer a{color:var(--muted);font-weight:600;text-decoration:none;margin-right:14px}
footer a:hover{color:var(--text)}

@media (max-width:980px){
  .layout,.two{grid-template-columns:1fr}
  .filters{position:static}
  .plans{grid-template-columns:1fr 1fr}
  .path{grid-template-columns:repeat(4,1fr)}
}
@media (max-width:760px){
  .menu-btn{display:inline-flex}
  .nav{display:none;width:100%;flex-direction:column;align-items:stretch;padding-bottom:10px}
  .nav.open{display:flex}
  .nav a{padding:11px 10px}
  .nav a.on{border-bottom-color:transparent;background:var(--soft-pet)}
  .stats{grid-template-columns:1fr 1fr}
  .opts,.fields{grid-template-columns:1fr}
  .co{grid-template-columns:1fr}
  .co .side{align-items:flex-start;flex-direction:row;flex-wrap:wrap}
  .wa-float span{display:none}
  .wa-float{padding:14px}
}
@media (max-width:520px){
  .plans{grid-template-columns:1fr}
  .path{grid-template-columns:1fr 1fr}
  .brand .wm b{font-size:1.2rem}
  .brand svg{width:34px;height:34px}
  .bar{grid-template-columns:minmax(0,1fr) 1fr 36px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{
  .top,.demo-strip,.wa-float,footer,.filters,.no-print{display:none!important}
  body{background:#fff;color:#000}
  .modal-bg{position:static;background:none;padding:0}
  .modal{max-height:none;border:0}

    const r = mulberry32(hashStr("gtf-"+cc));
    const sp = SPEC[cc]; const sCodes = (sp?.s||[]).filter(c=>CODE[c]); const bCodes = (sp?.b||[]).filter(c=>CODE[c]);
    const n = cc==="CO" ? 22 : (sp ? 9 : 3) + Math.floor(r()*(sp?7:3));
    const used = new Set();
    for(let i=0;i<n;i++){
      let role = r() < 0.2 ? "both" : (r() < (sCodes.length/(sCodes.length+bCodes.length+0.01) || 0.5) ? "supplier" : "buyer");
      if(!sp) role = pick(r,["supplier","buyer","both"]);
      const pool = role==="buyer" ? (bCodes.length?bCodes:validCodes) : role==="supplier" ? (sCodes.length?sCodes:validCodes) : [...sCodes, ...bCodes].length ? [...sCodes,...bCodes] : validCodes;
      const k = 1 + Math.floor(r()*3); const codes = [];
      for(let j=0;j<k*3 && codes.length<k;j++){ const c = pick(r,pool); if(!codes.some(x=>related(x,c))) codes.push(c); }
      const sector = CODE[codes[0]].sector;
      const es = ES_CC.has(cc); const lg = es ? "es" : "en";
      let name, tries = 0;
      do {
        const pre = pick(r, es?PRE_ES:PRE_EN), core = pick(r, CORE[sector][lg]);
        name = role==="buyer" && r()<0.6 ? (es ? `${pick(r,BUY_WORD.es)} ${pre} ${core}` : `${pre} ${core} ${pick(r,BUY_WORD.en)}`) : `${pre} ${core}`;
        name += " " + (LEGAL[cc]||"Ltd.");
        tries++;
      } while(used.has(name) && tries<10);
      used.add(name);
      const city = pick(r, CITY[cc] || [null]) ;
      const mkPool = role==="buyer" ? ALL_CC.filter(x => SPEC[x]?.s?.some(c => codes.some(cd=>related(cd,c)))) : ALL_CC.filter(x => SPEC[x]?.b?.some(c => codes.some(cd=>related(cd,c))));
      const markets = [...new Set(Array.from({length:2+Math.floor(r()*3)},()=> pick(r, mkPool.length?mkPool:ALL_CC)))].filter(x=>x!==cc);
      const certPool = CERTS[sector]; const certs = [...new Set([pick(r,certPool), pick(r,certPool)])];
      const inc = [...new Set([pick(r,INCOS.slice(1,6)), pick(r,INCOS)])];
      const slug = norm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").split("-").slice(0,3).join("-");

        founded: 1972 + Math.floor(r()*50), emp: 1+Math.floor(r()*5), vol: 1+Math.floor(r()*5),
        verified: r() < 0.62, active: Math.floor(r()*40), certs, inc, markets,

        phone: "+"+(r()*80+10|0)+" "+(r()*900+100|0)+" "+(r()*9000+1000|0) });
    }
  });
  return out;
}

function parseQuery(q){
  const nq = norm(q); const res = { codes:[], ccs:[], conts:[], subs:[], words:[] };
  if(!nq) return res;
  const digits = nq.replace(/[.\s]/g,"");
  if(/^\d{2,6}$/.test(digits)){ res.codes.push(digits); return res; }
  ALL_CC.forEach(cc => { const n = norm(cname(cc)); if(n && (nq===n || nq.includes(n) || (nq.length>=4 && n.startsWith(nq)))) res.ccs.push(cc); });
  GEO.forEach(ct => { if([ct.es,ct.en].some(x => norm(x)===nq)) res.conts.push(ct.id); ct.subs.forEach(s => { if([s.es,s.en].some(x => norm(x)===nq)) res.subs.push(s.id); }); });
  let rest = nq; res.ccs.forEach(cc => rest = rest.replace(norm(cname(cc)),""));
  res.words = rest.split(/\s+/).filter(w => w.length>1 && !["de","del","la","el","los","las","en","y","of","the","and","for","para","con"].includes(w));
  return res;
}

}

}
function searchCompanies(f){
  const p = parseQuery(f.q);
  const wordCodes = codesForWords(p.words);
  const role = f.mode==="buyers" ? "buyer" : f.mode==="suppliers" ? "supplier" : (f.role||"");
  let list = allCompanies().filter(co => {
    if(role && co.role!==role && co.role!=="both") return false;
    if(!geoOk(co, f)) return false;
    if(f.sector && co.sector!==f.sector) return false;
    if(f.hs && !co.codes.some(c => related(c, f.hs))) return false;
    if(f.verified && !co.verified && !co.mine) return false;
    if(p.ccs.length && !p.ccs.includes(co.cc)) return false;
    if(p.conts.length && !p.conts.includes(COUNTRY[co.cc]?.cont)) return false;
    if(p.subs.length && !p.subs.includes(COUNTRY[co.cc]?.sub)) return false;
    if(p.codes.length && !co.codes.some(c => p.codes.some(q2 => related(c,q2)))) return false;
    if(p.words.length){
      const byCode = co.codes.some(c => wordCodes.some(w => related(c,w)));
      const byName = p.words.every(w => norm(co.name+" "+cityOf(co)).includes(w));
      if(!byCode && !byName) return false;
    }
    return true;
  });
  const score = (co) => (co.mine?100:0) + (co.verified?5:0) + (PLAN!=="free" && co.mine ? 0 : 0) - co.active/10 + (co.codes.length);
  if(f.sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
  else if(f.sort==="active") list.sort((a,b)=>a.active-b.active);
  else if(f.sort==="size") list.sort((a,b)=>(b.vol||0)-(a.vol||0));
  else list.sort((a,b)=>score(b)-score(a));
  return list;
}

  const p = parseQuery(q);
  let codes;
  if(p.codes.length){ const d = p.codes[0]; codes = Object.keys(CODE).filter(c => related(c,d)); }
  else if(p.words.length) codes = codesForWords(p.words);
  else codes = Object.keys(CODE);
  return codes.sort();
}
const countFor = (code, filt={}) => {
  let s=0,b=0; allCompanies().forEach(co => { if(!geoOk(co,filt)) return; if(!co.codes.some(c=>related(c,code))) return; if(co.role!=="buyer") s++; if(co.role!=="supplier") b++; });
  return {s,b};
};
const countryStats = (cc) => { const cs = allCompanies().filter(c=>c.cc===cc); return { s:cs.filter(c=>c.role!=="buyer").length, b:cs.filter(c=>c.role!=="supplier").length, n:cs.length }; };

/* sugerencias del buscador */
function suggestions(q){
  const nq = norm(q); if(nq.length<2) return [];
  const out = [];
  const digits = nq.replace(/[.\s]/g,"");
  if(/^\d+$/.test(digits)){
    Object.values(CODE).filter(c=>c.code.startsWith(digits)).slice(0,6).forEach(c => out.push({k:"HS", v:fmtCode(c.code), d:L(c), q:c.code}));
    HS_CHAPTERS.filter(c=>c[0].startsWith(digits.slice(0,2))).slice(0,2).forEach(c => out.push({k:t("chapter"), v:c[0], d:LANG==="en"?c[2]:c[1], q:c[0]}));
    return out;
  }
  Object.values(CODE).filter(c => norm(c.es+" "+c.en+" "+c.kw).includes(nq)).slice(0,6).forEach(c => out.push({k:"HS", v:fmtCode(c.code), d:L(c), q:c.code}));
  ALL_CC.filter(cc => norm(cname(cc)).includes(nq)).slice(0,4).forEach(cc => out.push({k:t("lv_country"), v:cc, d:cname(cc), q:cname(cc)}));
  GEO.forEach(ct => ct.subs.forEach(s => { if(norm(L(s)).includes(nq)) out.push({k:t("lv_sub"), v:"", d:L(s), q:L(s)}); }));
  return out.slice(0,10);
}

    </div>
  </form>`;

function bindSearchBox(){
  const f = $("#sform"); if(!f) return;
  const q = $("#q"), box = $("#suggest"); let act = -1, items = [];
  $$("[data-mode]", f).forEach(b => b.onclick = () => { S.mode = b.dataset.mode; $$("[data-mode]",f).forEach(x=>x.setAttribute("aria-selected", x===b)); q.placeholder = t("ph_"+S.mode); q.focus(); });
  $$("[data-quick]", f).forEach(b => b.onclick = () => { S.q = ""; S.hs = b.dataset.quick; if(S.mode==="markets") S.mode="suppliers"; go("buscar"); });
  const close = () => { box.hidden = true; act=-1; };
  q.oninput = () => {
    items = suggestions(q.value);
    if(!items.length){ close(); return; }
    box.innerHTML = items.map((s,i)=>`<button type="button" role="option" data-i="${i}"><span class="k">${esc(s.k)}</span><span class="mono">${esc(s.v)}</span><span>${esc(s.d)}</span></button>`).join("");
    box.hidden = false;
    $$("button", box).forEach(b => b.onmousedown = (e) => { e.preventDefault(); choose(items[+b.dataset.i]); });
  };
  q.onkeydown = (e) => {
    if(box.hidden) return;
    const bs = $$("button", box);
    if(e.key==="ArrowDown"){ act = Math.min(act+1, bs.length-1); e.preventDefault(); }
    else if(e.key==="ArrowUp"){ act = Math.max(act-1, 0); e.preventDefault(); }
    else if(e.key==="Enter" && act>=0){ e.preventDefault(); choose(items[act]); return; }
    else if(e.key==="Escape"){ close(); return; }
    bs.forEach((b,i)=>b.classList.toggle("act", i===act));
  };
  q.onblur = () => setTimeout(close, 120);
  const choose = (s) => { close(); if(s.k==="HS" || s.k===t("chapter")){ S.hs = s.q; S.q = ""; } else { S.q = s.q; } submit(); };
  const submit = () => { if(S.mode==="markets"){ const p = parseQuery(S.q); if(p.ccs.length===1){ go("pais-"+p.ccs[0]); return; } if(p.subs.length){ go("sub-"+p.subs[0]); return; } if(p.conts.length){ go("region-"+p.conts[0]); return; } } go("buscar"); };
  f.onsubmit = (e) => { e.preventDefault(); S.q = q.value.trim(); submit(); };
}

/* ---------- Botón "atrás": nunca saca de la app sin aviso ---------- */
function installBackGuard(){
  try {
    history.replaceState({ gtf:"root" }, "", location.href);
    history.pushState({ gtf:"app" }, "", location.href);
    let warned = 0;
    window.addEventListener("popstate", (e) => {
      if($(".modal-bg")) closeModal();
      if(e.state && e.state.gtf==="root"){
        if(Date.now() - warned < 3000){ history.back(); return; }   // segundo "atrás": sale
        warned = Date.now(); toast(t("back_exit"));
        history.pushState({ gtf:"app" }, "", location.href);
      }
    });
  } catch(e){ /* navegador sin historial manipulable: se usa el comportamiento normal */ }
}

function bindRegister(){
  const form = $("#rform");
  $$("[data-role]",form).forEach(b => b.onclick = () => { REG.role = b.dataset.role; $$("[data-role]",form).forEach(x=>x.setAttribute("aria-pressed", x===b)); $("#e-role").textContent=""; });

  $("#r-ok").onchange = (e) => REG.ok = e.target.checked;
  const addCode = () => {
    if(!$("#r-hs")) return;               // el usuario ya salió del formulario
    const v = $("#r-hs").value.trim(); if(!v) return;
    let code = (v.match(/^\d{2,6}/)||[])[0];
    if(!code){ const found = searchCodes(v)[0]; code = found; }
    if(code && (CODE[code]||CHAP[code]) && !REG.codes.includes(code)){ REG.codes.push(code); if(!REG.sector && CODE[code]) REG.sector = CODE[code].sector; }
    $("#r-hs").value = ""; setTimeout(() => { render(); $("#r-hs")?.focus(); }, 0);
  };
  $("#r-hs-add").onclick = addCode;
  $("#r-hs").addEventListener("change", () => setTimeout(addCode, 0));
  $("#r-hs").addEventListener("keydown", e => { if(e.key==="Enter"){ e.preventDefault(); addCode(); } });
  $$("[data-rm]",form).forEach(b => b.onclick = () => { REG.codes = REG.codes.filter(c=>c!==b.dataset.rm); render(); });
  form.onsubmit = (e) => {
    e.preventDefault();
    $$(".err",form).forEach(x=>x.textContent="");
    const errs = {};
    if(!REG.role) errs.role = t("err_profile");
    ["name","city","contact","email"].forEach(k => { if(!String(REG[k]||"").trim()) errs[k] = t("err_req"); });
    if(REG.email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(REG.email)) errs.email = t("err_email");
    if(!REG.sector) errs.sector = t("err_req");
    if(!REG.codes.length) errs.codes = t("err_hs");
    if(!REG.ok) errs.ok = t("err_accept");
    Object.entries(errs).forEach(([k,v]) => { const el = $("#e-"+k); if(el) el.textContent = v; });
    if(Object.keys(errs).length){ const first = $(".err:not(:empty)",form); first?.scrollIntoView({behavior:"smooth",block:"center"}); return; }
    const wasNew = !ACC;
    ACC = {...REG, updated:new Date().toISOString()}; store.set("account", ACC); REG = null;
    toast(wasNew ? t("r_saved") : t("r_updated")); go("empresa-me");
  };
}

/* ---------- Ventanas ---------- */
function modal(html, bind){
  const root = $("#modalRoot");
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  const m = $(".modal", root);
  $("#mbg").addEventListener("mousedown", e => { if(e.target.id==="mbg") closeModal(); });
  $$("[data-close]", m).forEach(b => b.onclick = closeModal);
  document.addEventListener("keydown", escClose);
  bind && bind(m);
  setTimeout(() => { const first = $("input,select,textarea,button", m); first && first.focus(); }, 30);
}
function escClose(e){ if(e.key==="Escape") closeModal(); }
function closeModal(){ $("#modalRoot").innerHTML = ""; document.body.classList.remove("pr"); document.removeEventListener("keydown", escClose); }

function exportRows(){
  if(LAST.kind==="companies") return { head:[t("companies"),t("f_role"),t("lv_country"),t("r_city"),t("lv_sector"),t("lv_hs"),t("verified"),t("email"),t("phone")],
    rows: LAST.rows.slice(0,200).map(co => [co.name, t(co.role), cname(co.cc), co.city||"—", L(SECTOR[co.sector]), co.codes.map(fmtCode).join(" "), co.verified?"✓":"", canSee(co)?co.email:"—", canSee(co)?co.phone:"—"]) };
  if(LAST.kind==="codes") return { head:[t("lv_hs"),t("lv_product"),t("lv_sector"),t("suppliers"),t("buyers")],
    rows: LAST.rows.slice(0,200).map(c => { const n = countFor(c,{cont:S.cont,sub:S.sub,cc:S.cc}); return [fmtCode(c), codeLabel(c), L(SECTOR[CODE[c]?.sector]), n.s, n.b]; }) };
  return { head:[t("lv_country"),t("lv_sub"),t("suppliers"),t("buyers")], rows: LAST.rows.map(cc => { const s=countryStats(cc); return [cname(cc), L(SUB[COUNTRY[cc].sub]), s.s, s.b]; }) };
}
const reportFootText = () => `${t("report_by")} · ${SG.mail} · WhatsApp ${SG.wa} · ${t("generated")}: ${new Date().toLocaleString(LANG==="en"?"en-US":"es-CO")}`;
function openExport(){
  if(gateP("export","w_export")) return;
  const { head, rows } = exportRows();
  const title = describeSearch(S);
  modal(`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><span style="width:34px;height:34px;display:block">${ICON.logo}</span><div><h2 style="margin:0">Global Trade Finder</h2><div class="muted" style="font-size:.86rem">${esc(title)}</div></div></div>
    <p class="muted no-print" style="margin:6px 0 10px;font-size:.88rem">${t("export_lead")}</p>
    <div class="tablewrap"><table class="t" id="exp-table"><thead><tr>${head.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(v=>`<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
    <div class="report-foot">${ICON.logo}<span>${esc(reportFootText())}</span></div>
    <div class="acts no-print"><button class="btn btn-ghost" data-close>${t("close")}</button><button class="btn btn-ghost" id="x-copy">${t("copy")}</button>${FRAMED?"":`<button class="btn btn-ghost" id="x-csv">${t("download_csv")}</button><button class="btn btn-main" id="x-print">${t("print")}</button>`}</div>`, (m) => {
    const tsv = [head, ...rows].map(r => r.join("\t")).join("\n") + "\n\n" + reportFootText();
    $("#x-copy",m).onclick = () => { const ok = () => toast(t("copied")); try { navigator.clipboard.writeText(tsv).then(ok, () => selectTable()); } catch(e){ selectTable(); } };
    const selectTable = () => { const r = document.createRange(); r.selectNode($("#exp-table",m)); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
    const csvB = $("#x-csv",m); if(csvB) csvB.onclick = () => {
      const q = (v) => '"'+String(v).replaceAll('"','""')+'"';
      const csv = "﻿" + [head, ...rows].map(r => r.map(q).join(",")).join("\r\n") + "\r\n\r\n" + q(reportFootText()) + "\r\n";
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"})); a.download = "global-trade-finder-"+new Date().toISOString().slice(0,10)+".csv"; document.body.appendChild(a); a.click(); a.remove(); };
    const pB = $("#x-print",m); if(pB) pB.onclick = () => { document.body.classList.add("pr"); window.print(); setTimeout(()=>document.body.classList.remove("pr"), 500); };
  });
}

const vNotFound = () => `<div class="wrap page"><div class="empty"><b>404</b><a href="#inicio">${t("home")}</a></div></div>`;

/* ---------- Enrutador ---------- */
let RENDERING = false;
function render(){
  if(RENDERING){ setTimeout(render, 0); return; }   // evita redibujar dentro de otro redibujo (blur/change)
  RENDERING = true;
  try { renderNow(); } finally { RENDERING = false; }
}
function renderNow(){
  let h; try { h = decodeURIComponent((location.hash||"#inicio").slice(1)) || "inicio"; } catch(e){ h = "404"; }
  h = h.replace(/^(pais|pc)-([a-z]{2})/, (m,a,b)=>a+"-"+b.toUpperCase());
  const [r, a, b] = h.split("-");
  let html, bind = null;
  switch(r){
    case "inicio": html = vHome(); bind = () => { bindSearchBox(); bindHow(); }; break;
    case "buscar": html = vSearch(); bind = bindSearch; break;
    case "mercados": html = vMarkets(); break;
    case "region": html = vRegion(a); break;
    case "sub": html = vSub(a+"-"+b); break;
    case "pais": html = vCountry(a, b); bind = () => bindCountry(a, b); break;
    case "pc": html = vCountryCode(a, b); break;
    case "hs": if(a){ html = vCode(a); bind = () => bindCode(a); } else { html = vHS(); bind = bindHS; } break;
    case "sec": html = vSection(a); break;
    case "cap": html = vChapter(a); break;
    case "empresas": html = vDirectory(); bind = bindDirectory; break;
    case "empresa": html = vCompany(a); bind = () => bindCompany(a); break;
    case "planes": html = vPlans(); bind = bindPlans; break;
    case "registro": if(PAID() && !can("profile")){ html = `<div class="wrap page"><div class="empty"><b>${t("perm_title")}</b>${t("perm_msg",{lvl:t("lvl_"+ULEVEL),what:t("w_profile")})}</div></div>`; } else if(PAID()){ html = vRegister(); bind = bindRegister; } else { html = vObserver(); bind = bindObserver; } break;
    case "cuenta": html = vAccount(); bind = bindAccount; break;
    case "terminos": html = vTerms(); break;
    case "privacidad": html = vPrivacy(); break;
    default: html = vNotFound();
  }
  if(r!=="registro") REG = null;
  chrome();
  V.innerHTML = html;
  bind && bind();
  $("#mainNav").classList.remove("open"); $("#menuBtn").setAttribute("aria-expanded","false");
}
let lastRoute = "";
window.addEventListener("hashchange", () => {
  const r = (location.hash||"#inicio").slice(1);
  if($(".modal-bg")) closeModal();
  if(r!==lastRoute){ if(!r.startsWith("buscar") && !r.startsWith("empresas")) shown = PAGE; lastRoute = r; render(); window.scrollTo(0,0); }
});
$$(".lang button").forEach(b => b.onclick = () => { LANG = b.dataset.lang; store.set("lang", LANG); render(); });
$("#menuBtn").onclick = () => { const n = $("#mainNav"); n.classList.toggle("open"); $("#menuBtn").setAttribute("aria-expanded", n.classList.contains("open")); };
lastRoute = (location.hash||"#inicio").slice(1);
installBackGuard();
render();

</script>
